# Deploys the current year's book with mike, which publishes each year as
# its own versioned subpath (e.g. /f25/, /f26/) with a version-switcher
# dropdown, rather than overwriting the whole site on every push.
#
# NOTE: this workflow is new and has not been exercised by an actual push
# yet - review it (branch name, YEAR value, GitHub Pages source setting)
# before relying on it. It targets the same `deployed-pages` branch the old
# mdbook deploy used, to avoid re-touching GitHub Pages settings, but that
# should be double-checked against the repo's current Pages configuration.
name: Deploy
on:
  push:
    branches:
      - main

# Needed for the GITHUB_TOKEN to push to the deployed-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Bump this at the start of each semester, alongside resetting docs/.
      YEAR: f26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure git for mike's commits
        run: |
          git config user.name "Deploy from CI"
          git config user.email ""
      - name: Fetch existing deployed-pages branch
        # mike needs the prior deployed versions present locally so it can
        # add this year's build alongside them instead of starting fresh.
        run: git fetch origin deployed-pages --depth=1 || true
      - name: Deploy this year's book and set it as the default
        run: |
          mike deploy --push --branch deployed-pages --update-aliases "$YEAR" latest
          mike set-default --push --branch deployed-pages latest

# NOTE: `gh-pages` was avoided as the target branch name because GitHub had
# an un-removeable default GHAction on branch "gh-pages" that overwrote
# pushes from this deploy action; using a differently-named branch
# (deployed-pages) side-stepped that. Confirm this is still necessary /
# still true before changing the branch name.
